<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 가족 단톡방 링크로만 보는 페이지다. 검색에 걸리면 안 된다 -->
<meta name="robots" content="noindex, nofollow">
<title>아기 소식 · 배냇함</title>
<meta property="og:title" content="아기 소식이 도착했어요">
<meta property="og:description" content="엄마 아빠가 보내는 아기 소식이에요 · 배냇함">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<!--
  배냇함 — 가족 소식 페이지 (news.html)

  할머니 · 할아버지는 앱을 깔고 로그인하기 어렵다. 카톡에서 링크를 누르면 바로 보이게 한다.
    · 로그인 없음. 링크 안의 긴 번호(news id)를 아는 사람만 열 수 있다
    · 엄마 아빠가 '보낸' 것만 보인다 — 주간 사진과 한 줄, 심장 소리, 출생 소식
      (증상 · 체중 · 문답 · 신청 같은 건 여기에 절대 안 온다)
    · 엄마 아빠가 링크를 바꾸면 예전 링크는 닫힌다
    · 맨 아래에서 앱으로 데려간다

  데이터: Firestore news/{id} — 규칙은 '읽기는 id 를 아는 사람, 쓰기는 가족(도우미 제외)'
  파이어베이스 SDK 없이 REST 로 한 번만 읽는다 (가볍게).
-->
<style>
  :root { --paper:#FFFDF9; --line:#EFE7DC; --ink:#3B322C; --sub:#8A7F76; --mute:#B5AAA0; --gold:#B98A2E; --bg:#F6F0E6;
          --serif:'Gowun Batang','Noto Serif KR',serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 480px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 18px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .paper { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px; margin-bottom: 14px; }
  .kicker { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 4px; }
  .serif { font-family: var(--serif); }
  .meta { font-size: 13px; font-weight: 600; color: var(--sub); }
  h1 { font-family: var(--serif); font-size: 30px; font-weight: 700; letter-spacing: -0.8px; margin: 10px 0 6px; line-height: 1.3; word-break: keep-all; }
  .wk { font-family: var(--serif); font-size: 26px; font-weight: 700; letter-spacing: -0.6px; }
  .photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 16px; display: block; background: var(--line); margin-top: 12px; }
  .line { font-family: 'Nanum Pen Script', cursive; font-size: 27px; color: #6F645C; margin-top: 12px; line-height: 1.35; word-break: keep-all; }
  audio { width: 100%; margin-top: 10px; height: 40px; }
  .cta { display: block; text-align: center; padding: 16px; border-radius: 14px; background: var(--ink); color: #FFFDF9; font-size: 15px; font-weight: 700; text-decoration: none; margin-top: 14px; }
  .foot { text-align: center; font-size: 12px; font-weight: 600; color: var(--mute); margin-top: 18px; line-height: 1.7; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="paper center" style="padding:40px 20px;"><div class="meta">소식을 불러오는 중이에요</div></div>
</div>
<script>
(function () {
  'use strict';
  var PROJECT = "happybaby-6de42";
  var KEY = "AIzaSyDyXVAf-uiqutmfCd5Bhh34bQmbnFynpas";
  var APP_LINK = "https://happy-baby0303.github.io/";
  var app = document.getElementById("app");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { u = String(u || ""); return /^https:\/\/firebasestorage\.googleapis\.com\//.test(u) ? u : ""; }
  // Firestore REST 값 → 보통 값
  function val(v) {
    if (!v) return null;
    if ("stringValue" in v) return v.stringValue;
    if ("integerValue" in v) return Number(v.integerValue);
    if ("doubleValue" in v) return Number(v.doubleValue);
    if ("booleanValue" in v) return v.booleanValue;
    if ("nullValue" in v) return null;
    if ("mapValue" in v) { var o = {}, f = (v.mapValue && v.mapValue.fields) || {}; Object.keys(f).forEach(function (k) { o[k] = val(f[k]); }); return o; }
    if ("arrayValue" in v) return ((v.arrayValue && v.arrayValue.values) || []).map(val);
    return null;
  }
  function fromKey(k) { var p = String(k || "").split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function md(k) { var d = fromKey(k); return isNaN(d) ? "" : (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
  function call(n, j) { var c = n.charCodeAt(n.length - 1), jong = c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; return n + (jong ? "이" : "") + (j || ""); }

  function nothing(msg) {
    app.innerHTML = '<div class="paper center" style="padding:44px 22px;">' +
      '<div class="serif" style="font-size:20px;font-weight:700;margin-bottom:10px;">소식을 찾을 수 없어요</div>' +
      '<div class="meta" style="line-height:1.7;">' + esc(msg || "링크가 바뀌었을 수 있어요. 보내 준 가족에게 새 링크를 물어봐 주세요.") + '</div></div>' + footer();
  }
  function footer() {
    return '<div class="paper center" style="margin-top:22px;">' +
      '<div class="serif" style="font-size:18px;font-weight:700;">배냇함</div>' +
      '<div class="meta" style="margin-top:6px;line-height:1.7;">엄마 아빠, 할머니 할아버지가 같이 쓰는<br>아이가 스무 살에 여는 상자</div>' +
      '<a class="cta" href="' + APP_LINK + '">배냇함 알아보기</a></div>' +
      '<div class="foot">이 페이지는 링크를 받은 가족만 볼 수 있어요.</div>';
  }

  var id = new URLSearchParams(location.search).get("n") || "";
  if (!/^[A-Za-z0-9]{16,40}$/.test(id)) return nothing();

  fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents/news/" + id + "?key=" + KEY)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (doc) {
      var f = doc.fields || {}, d = {};
      Object.keys(f).forEach(function (k) { d[k] = val(f[k]); });
      if (d.off) return nothing();
      var name = d.name || "우리 아기";
      document.title = name + " 소식 · 배냇함";
      var html = "";

      // 태어났으면 맨 위에
      if (d.born && d.born.name) {
        var b = d.born, bd = fromKey(b.date);
        html += '<div class="paper center" style="padding:34px 22px;">' +
          '<div class="kicker">태어났어요</div>' +
          '<div class="serif" style="font-size:52px;font-weight:700;letter-spacing:-1.5px;margin:18px 0 12px;">' + esc(b.name) + '</div>' +
          '<div class="serif" style="font-size:18px;">' + bd.getFullYear() + '. ' + (bd.getMonth() + 1) + '. ' + bd.getDate() + '.</div>' +
          ([b.weight ? b.weight + "kg" : "", b.height ? b.height + "cm" : ""].filter(Boolean).length
            ? '<div class="meta" style="margin-top:8px;">' + [b.weight ? b.weight + "kg" : "", b.height ? b.height + "cm" : ""].filter(Boolean).join(" · ") + '</div>' : '') +
          (b.line ? '<div class="line">' + esc(b.line) + '</div>' : '') + '</div>';
      }

      // 머리
      var wkNow = "";
      if (d.due && !(d.born && d.born.name)) {
        var t = new Date(); t.setHours(0, 0, 0, 0);
        var ga = 280 - Math.round((fromKey(d.due) - t) / 86400000);
        if (ga >= 0 && ga <= 300) wkNow = " · 지금 " + Math.floor(ga / 7) + "주";
      }
      html += '<div style="padding:6px 4px 16px;">' +
        '<div class="kicker">' + esc(name) + ' 소식</div>' +
        '<h1>' + esc(call(name, "가")) + ' 자라는 이야기</h1>' +
        (d.due && !(d.born && d.born.name) ? '<div class="meta">' + md(d.due) + ' 예정' + wkNow + '</div>' : '') + '</div>';

      // 심장 소리
      var hearts = d.hearts ? Object.keys(d.hearts).map(function (k) { return d.hearts[k]; }) : [];
      hearts = hearts.filter(function (h) { return h && safeUrl(h.url); }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
      hearts.forEach(function (h) {
        html += '<div class="paper">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;"><span class="wk">심장 소리</span><span class="meta">' + (h.week ? h.week + '주 · ' : '') + md(h.key) + '</span></div>' +
          '<audio controls preload="none" src="' + esc(safeUrl(h.url)) + '"></audio>' +
          (h.line ? '<div class="line">' + esc(h.line) + '</div>' : '') + '</div>';
      });

      // 주간 소식 (최근 것부터)
      var weeks = d.weeks ? Object.keys(d.weeks).map(Number).sort(function (a, b) { return b - a; }) : [];
      weeks.forEach(function (wk) {
        var w = d.weeks[wk]; if (!w || !safeUrl(w.url)) return;
        html += '<div class="paper">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;"><span class="wk">' + wk + '주</span><span class="meta">' + md(w.key) + '</span></div>' +
          '<img class="photo" loading="lazy" alt="" src="' + esc(safeUrl(w.url)) + '">' +
          (w.line ? '<div class="line">' + esc(w.line) + '</div>' : '') + '</div>';
      });

      if (!hearts.length && !weeks.length && !(d.born && d.born.name)) {
        html += '<div class="paper center"><div class="meta">아직 올라온 소식이 없어요.</div></div>';
      }
      app.innerHTML = html + footer();
    })
    .catch(function () { nothing(); });
})();
</script>
</body>
</html>
